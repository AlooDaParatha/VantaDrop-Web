<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Your Cart — VantaDrop</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="assets/logo/VantaLogoLight.jpg" class="logo-img" alt="VantaDrop Logo">
        <span class="brand-text">VantaDrop</span>
      </a>
      <nav class="site-nav">
        <a class="nav-link" href="index.html">Catalog</a>
        <a class="nav-link cart">Cart (<span id="cart-count">0</span>)</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <h1>Your Cart</h1>
    <div id="cart-items"></div>
    <div class="cart-summary">
      <h3>Total: ₹<span id="cart-total">0</span></h3>
      <button id="checkout" class="btn primary">Checkout Securely</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div><h4>VantaDrop</h4><p class="muted small">Stripe checkout integration</p></div>
    </div>
  </footer>

  <script>
    const stripe = Stripe("pk_test_51SDS4ZQ5x7S6Z1TfskS5RPlgLAcwGobIJWt9vpSIVLC2HkOFaCpR50QOc45zcZl9RSRjeJGxnstHDkyhKYDz6ogz006BQFjb20"); // ⚡ replace with your real publishable key

    // Get cart from localStorage
    function getCart() {
      return JSON.parse(localStorage.getItem('cart') || '[]');
    }

    function renderCart() {
      const cartContainer = document.getElementById('cart-items');
      const cart = getCart();

      if (cart.length === 0) {
        cartContainer.innerHTML = "<p>Your cart is empty.</p>";
        document.getElementById('cart-total').textContent = "0";
        return;
      }

      cartContainer.innerHTML = cart.map(item => `
        <div class="cart-item">
          <span>${item.name}</span>
          <span>₹${item.price} × ${item.qty}</span>
        </div>
      `).join('');

      const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      document.getElementById('cart-total').textContent = total;
    }

    document.getElementById("checkout").addEventListener("click", async () => {
      const cart = getCart();

      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }

      try {
        // Call your Firebase backend (replace project ID)
        const response = await fetch("https://vantadrop-stripe-server.vercel.app/create-checkout-session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items: cart })
        });

        const session = await response.json();

        const result = await stripe.redirectToCheckout({ sessionId: session.id });
        if (result.error) alert(result.error.message);
      } catch (err) {
        console.error("Checkout error", err);
        alert("Error starting checkout. Please try again.");
      }
    });

    renderCart();
  </script>

  <script src="js/app.js"></script>
</body>
</html>
